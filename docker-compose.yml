services:
  api:
    labels:
    - traefik.docker.network=coolify
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - API_TOKEN=${API_TOKEN}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
      - DATABASE_URL=mysql+aiomysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb:3306/${MARIADB_DATABASE}
      - CLANIMG_API_URL=${CLANIMG_API_URL:-}
    depends_on:
      - mariadb
    networks:
      - network
      - coolify
    restart: unless-stopped

  mariadb:
    image: mariadb:latest
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  phpmyadmin:
    labels:
      - traefik.docker.network=coolify
    image: phpmyadmin/phpmyadmin
    environment:
      - PMA_HOST=${PMA_HOST:-mariadb}
      - PMA_PORT=${PMA_PORT:-3306}
      - PMA_USER=${PMA_USER}
      - PMA_PASSWORD=${PMA_PASSWORD}
    depends_on:
      - mariadb
    networks:
      - network
      - coolify
    restart: unless-stopped

networks:
  network:
    driver: bridge
  coolify:
    external: true

volumes:
  mysql_data: